<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genius - Jogo de Memória</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            overflow-y: auto;
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
            font-size: clamp(1.3rem, 5vw, 2.2rem);
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .score-container {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .score-box {
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .score-box span {
            color: #aaa;
            font-size: 0.75rem;
            display: block;
        }

        .score-box strong {
            color: #fff;
            font-size: 1.3rem;
        }

        .game-container {
            position: relative;
            width: min(85vw, 350px);
            height: min(85vw, 350px);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            padding: 6px;
            background: #2d2d2d;
            border-radius: 50%;
            box-shadow: 
                0 0 30px rgba(0,0,0,0.5),
                inset 0 0 30px rgba(0,0,0,0.3);
        }

        .color-btn {
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .color-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        #green {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border-radius: 100% 8px 8px 8px;
        }

        #green.active {
            background: #58d68d !important;
            box-shadow: 0 0 50px #2ecc71, inset 0 0 40px rgba(255,255,255,0.4);
        }

        #red {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border-radius: 8px 100% 8px 8px;
        }

        #red.active {
            background: #ec7063 !important;
            box-shadow: 0 0 50px #e74c3c, inset 0 0 40px rgba(255,255,255,0.4);
        }

        #yellow {
            background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
            border-radius: 8px 8px 8px 100%;
        }

        #yellow.active {
            background: #f4d03f !important;
            box-shadow: 0 0 50px #f1c40f, inset 0 0 40px rgba(255,255,255,0.4);
        }

        #blue {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border-radius: 8px 8px 100% 8px;
        }

        #blue.active {
            background: #5dade2 !important;
            box-shadow: 0 0 50px #3498db, inset 0 0 40px rgba(255,255,255,0.4);
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28%;
            height: 28%;
            background: linear-gradient(135deg, #3d3d3d 0%, #2d2d2d 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 
                0 5px 20px rgba(0,0,0,0.5),
                inset 0 -5px 20px rgba(0,0,0,0.3);
            z-index: 10;
            pointer-events: none;
        }

        .center-circle span {
            color: #fff;
            font-size: clamp(0.5rem, 2vw, 0.8rem);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-btn {
            padding: 14px 35px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        #startBtn {
            background: linear-gradient(135deg, #00b894 0%, #00a388 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(0,184,148,0.4);
        }

        #startBtn:active {
            transform: scale(0.95);
        }

        .message {
            margin-top: 12px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            min-height: 25px;
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            max-width: 90%;
        }

        .message.error {
            background: rgba(231, 76, 60, 0.4);
            animation: shake 0.5s ease;
        }

        .message.success {
            background: rgba(46, 204, 113, 0.4);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .difficulty-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .difficulty-btn {
            padding: 6px 16px;
            border: 2px solid rgba(255,255,255,0.3);
            background: transparent;
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .difficulty-btn.active {
            background: rgba(255,255,255,0.25);
            border-color: #fff;
        }

        .sound-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            backdrop-filter: blur(10px);
            z-index: 100;
            touch-action: manipulation;
        }

        .instructions {
            color: rgba(255,255,255,0.5);
            font-size: 0.75rem;
            text-align: center;
            margin-top: 10px;
            max-width: 300px;
            line-height: 1.4;
        }

        /* Landscape mode adjustments */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 20px;
            }

            .game-container {
                width: min(50vh, 250px);
                height: min(50vh, 250px);
            }

            h1, .instructions {
                display: none;
            }

            .score-container, .difficulty-container, .btn-container, .message {
                position: static;
            }
        }

        /* Small phones */
        @media (max-width: 360px) {
            .game-container {
                width: 80vw;
                height: 80vw;
            }
            
            .score-box {
                padding: 6px 12px;
            }
            
            .game-btn {
                padding: 12px 25px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle">🔊</button>
    
    <h1>🧠 Genius</h1>
    
    <div class="score-container">
        <div class="score-box">
            <span>Pontuação</span>
            <strong id="score">0</strong>
        </div>
        <div class="score-box">
            <span>Recorde</span>
            <strong id="highScore">0</strong>
        </div>
    </div>

    <div class="difficulty-container">
        <button class="difficulty-btn active" data-speed="1000">Fácil</button>
        <button class="difficulty-btn" data-speed="600">Médio</button>
        <button class="difficulty-btn" data-speed="350">Difícil</button>
    </div>

    <div class="game-container" id="gameContainer">
        <button class="color-btn" id="green" data-color="green" disabled></button>
        <button class="color-btn" id="red" data-color="red" disabled></button>
        <button class="color-btn" id="yellow" data-color="yellow" disabled></button>
        <button class="color-btn" id="blue" data-color="blue" disabled></button>
        <div class="center-circle">
            <span>Genius</span>
        </div>
    </div>

    <div class="btn-container">
        <button class="game-btn" id="startBtn">▶ INICIAR</button>
    </div>

    <div class="message" id="message">Toque em INICIAR para jogar!</div>

    <p class="instructions">
        Memorize a sequência e repita tocando nas cores!
    </p>

    <script>
        // Game Elements
        const colorButtons = {
            green: document.getElementById('green'),
            red: document.getElementById('red'),
            yellow: document.getElementById('yellow'),
            blue: document.getElementById('blue')
        };
        const startBtn = document.getElementById('startBtn');
        const messageEl = document.getElementById('message');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const soundToggle = document.getElementById('soundToggle');
        const difficultyBtns = document.querySelectorAll('.difficulty-btn');

        // Game State
        let sequence = [];
        let playerSequence = [];
        let isPlaying = false;
        let isShowingSequence = false;
        let score = 0;
        let highScore = localStorage.getItem('geniusHighScore') || 0;
        let soundEnabled = true;
        let gameSpeed = 1000;
        let canPress = false;

        // Audio Context
        let audioContext = null;

        const frequencies = {
            green: 329.63,
            red: 261.63,
            yellow: 220.00,
            blue: 164.81
        };

        // Initialize
        highScoreEl.textContent = highScore;

        // Audio Functions
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function playTone(color, duration = 300) {
            if (!soundEnabled || !audioContext) return;
            
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.value = frequencies[color];
                
                gainNode.gain.setValueAtTime(0.4, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration / 1000);
            } catch(e) {
                console.log('Audio error:', e);
            }
        }

        function playErrorSound() {
            if (!soundEnabled || !audioContext) return;
            
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.value = 80;
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch(e) {
                console.log('Audio error:', e);
            }
        }

        // Game Functions
        function startGame() {
            initAudio();
            sequence = [];
            playerSequence = [];
            score = 0;
            scoreEl.textContent = score;
            isPlaying = true;
            startBtn.textContent = '⏳ JOGANDO...';
            startBtn.disabled = true;
            addToSequence();
        }

        function addToSequence() {
            const colors = ['green', 'red', 'yellow', 'blue'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            sequence.push(randomColor);
            playerSequence = [];
            canPress = false;
            
            showMessage(`Rodada ${sequence.length} - Observe!`, '');
            
            setTimeout(() => {
                showSequence();
            }, 600);
        }

        function showSequence() {
            isShowingSequence = true;
            disableButtons();
            
            let i = 0;
            
            function showNext() {
                if (i >= sequence.length) {
                    isShowingSequence = false;
                    canPress = true;
                    enableButtons();
                    showMessage('👆 Sua vez! Repita a sequência', '');
                    return;
                }
                
                activateColor(sequence[i]);
                i++;
                setTimeout(showNext, gameSpeed);
            }
            
            showNext();
        }

        function activateColor(color) {
            const btn = colorButtons[color];
            btn.classList.add('active');
            playTone(color, gameSpeed * 0.6);
            
            setTimeout(() => {
                btn.classList.remove('active');
            }, gameSpeed * 0.6);
        }

        function handleColorPress(color) {
            if (!isPlaying || isShowingSequence || !canPress) return;
            
            const btn = colorButtons[color];
            if (btn.disabled) return;
            
            // Visual and audio feedback
            btn.classList.add('active');
            playTone(color, 200);
            
            setTimeout(() => {
                btn.classList.remove('active');
            }, 200);
            
            playerSequence.push(color);
            
            const currentIndex = playerSequence.length - 1;
            
            if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                gameOver();
                return;
            }
            
            if (playerSequence.length === sequence.length) {
                score = sequence.length;
                scoreEl.textContent = score;
                canPress = false;
                
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('geniusHighScore', highScore);
                    showMessage('🎉 Novo Recorde! Próxima...', 'success');
                } else {
                    showMessage('✅ Correto! Próxima rodada...', 'success');
                }
                
                disableButtons();
                
                setTimeout(() => {
                    addToSequence();
                }, 1200);
            }
        }

        function gameOver() {
            isPlaying = false;
            canPress = false;
            playErrorSound();
            
            Object.values(colorButtons).forEach(btn => {
                btn.classList.add('active');
            });
            
            setTimeout(() => {
                Object.values(colorButtons).forEach(btn => {
                    btn.classList.remove('active');
                });
            }, 500);
            
            showMessage(`❌ Game Over! Pontos: ${score}`, 'error');
            
            startBtn.textContent = '🔄 JOGAR NOVAMENTE';
            startBtn.disabled = false;
            disableButtons();
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message';
            if (type) {
                messageEl.classList.add(type);
            }
        }

        function enableButtons() {
            Object.values(colorButtons).forEach(btn => {
                btn.disabled = false;
            });
        }

        function disableButtons() {
            Object.values(colorButtons).forEach(btn => {
                btn.disabled = true;
            });
        }

        // ===== EVENT LISTENERS =====

        // Start Button - works with both touch and click
        startBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (!startBtn.disabled) {
                startGame();
            }
        });

        // Color Buttons - Handle both touch and click
        Object.entries(colorButtons).forEach(([color, btn]) => {
            
            // Touch Start - primary for mobile
            btn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                handleColorPress(color);
            }, { passive: false });
            
            // Click - for desktop
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                handleColorPress(color);
            });
        });

        // Sound Toggle
        soundToggle.addEventListener('click', function(e) {
            e.preventDefault();
            initAudio();
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
        });

        soundToggle.addEventListener('touchstart', function(e) {
            e.preventDefault();
            initAudio();
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
        }, { passive: false });

        // Difficulty Buttons
        difficultyBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                if (isPlaying) return;
                
                difficultyBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameSpeed = parseInt(btn.dataset.speed);
            });
            
            btn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (isPlaying) return;
                
                difficultyBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameSpeed = parseInt(btn.dataset.speed);
            }, { passive: false });
        });

        // Keyboard controls (desktop)
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && !isPlaying) {
                e.preventDefault();
                startBtn.click();
                return;
            }
            
            if (!isPlaying || isShowingSequence || !canPress) return;
            
            const keyMap = {
                'KeyQ': 'green',
                'KeyW': 'red',
                'KeyA': 'yellow',
                'KeyS': 'blue',
                'ArrowUp': 'green',
                'ArrowRight': 'red',
                'ArrowLeft': 'yellow',
                'ArrowDown': 'blue'
            };
            
            if (keyMap[e.code]) {
                e.preventDefault();
                handleColorPress(keyMap[e.code]);
            }
        });

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        // Initialize audio on first interaction
        document.addEventListener('touchstart', function initOnTouch() {
            initAudio();
            document.removeEventListener('touchstart', initOnTouch);
        }, { once: true });

    </script>
</body>
</html>
